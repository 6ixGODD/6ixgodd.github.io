<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610"><rect x="0" y="0" width="1000" height="610" fill="white" /><text x="500" y="30" font-size="24" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">存储复用与循环融合</text><text x="25" y="70" font-size="21" fill="#262626" text-anchor="start" font-family="&quot;Times New Roman&quot;,Times,serif">保留 tmp</text><text x="975" y="70" font-size="18" fill="#666" text-anchor="end" font-family="&quot;Times New Roman&quot;,Times,serif">两次遍历 · 两个结果数组</text><rect x="35" y="95" width="140" height="55" fill="#f2f3f4" stroke="#aaa" /><text x="105.0" y="129.5" font-size="19" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">a</text><rect x="385" y="95" width="180" height="55" fill="#f2f3f4" stroke="#aaa" /><text x="475.0" y="129.5" font-size="19" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">tmp</text><rect x="790" y="95" width="180" height="55" fill="#f2f3f4" stroke="#aaa" /><text x="880.0" y="129.5" font-size="19" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">affine</text><polyline points="175,122 385,122" fill="none" stroke="#425c70" stroke-width="1.5" stroke-dasharray="none" /><polygon points="385,122 377.0,126.0 377.0,118.0" fill="#425c70" /><text x="280" y="109" font-size="18" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">遍历 1：× 2</text><polyline points="565,122 790,122" fill="none" stroke="#425c70" stroke-width="1.5" stroke-dasharray="none" /><polygon points="790,122 782.0,126.0 782.0,118.0" fill="#425c70" /><text x="678" y="109" font-size="18" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">遍历 2：+ 1</text><line x1="25" y1="210" x2="975" y2="210" stroke="#ddd" /><text x="25" y="240" font-size="21" fill="#262626" text-anchor="start" font-family="&quot;Times New Roman&quot;,Times,serif">out=work</text><text x="975" y="240" font-size="18" fill="#666" text-anchor="end" font-family="&quot;Times New Roman&quot;,Times,serif">两次遍历 · 一个工作数组</text><rect x="35" y="265" width="140" height="55" fill="#f2f3f4" stroke="#aaa" /><text x="105.0" y="299.5" font-size="19" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">a</text><rect x="385" y="265" width="180" height="55" fill="#e9eff3" stroke="#425c70" /><text x="475.0" y="299.5" font-size="19" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">work</text><polyline points="175,292 385,292" fill="none" stroke="#425c70" stroke-width="1.5" stroke-dasharray="none" /><polygon points="385,292 377.0,296.0 377.0,288.0" fill="#425c70" /><text x="280" y="279" font-size="18" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">遍历 1：× 2</text><polyline points="565,292 745,292 745,350 475,350 475,320" fill="none" stroke="#425c70" stroke-width="1.5" stroke-dasharray="none" /><polygon points="475,320 479.0,328.0 471.0,328.0" fill="#425c70" /><text x="700" y="277" font-size="18" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">遍历 2：读取并覆盖</text><line x1="25" y1="380" x2="975" y2="380" stroke="#ddd" /><text x="25" y="410" font-size="21" fill="#262626" text-anchor="start" font-family="&quot;Times New Roman&quot;,Times,serif">概念性融合循环</text><text x="975" y="410" font-size="18" fill="#666" text-anchor="end" font-family="&quot;Times New Roman&quot;,Times,serif">一次遍历 · 一个结果数组</text><rect x="35" y="435" width="140" height="55" fill="#f2f3f4" stroke="#aaa" /><text x="105.0" y="469.5" font-size="19" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">a</text><rect x="385" y="435" width="240" height="55" fill="#e9eff3" stroke="#425c70" /><text x="505.0" y="469.5" font-size="19" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">寄存器中的 x × 2 + 1</text><rect x="790" y="435" width="180" height="55" fill="#f2f3f4" stroke="#aaa" /><text x="880.0" y="469.5" font-size="19" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">结果</text><polyline points="175,462 385,462" fill="none" stroke="#425c70" stroke-width="1.5" stroke-dasharray="none" /><polygon points="385,462 377.0,466.0 377.0,458.0" fill="#425c70" /><text x="280" y="449" font-size="18" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">读入一个元素</text><polyline points="625,462 790,462" fill="none" stroke="#425c70" stroke-width="1.5" stroke-dasharray="none" /><polygon points="790,462 782.0,466.0 782.0,458.0" fill="#425c70" /><text x="708" y="449" font-size="18" fill="#262626" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">直接写出</text><line x1="25" y1="550" x2="975" y2="550" stroke="#ddd" /><text x="500" y="578" font-size="17" fill="#666" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">第三种是执行方式示意，普通 NumPy 复合表达式不自动保证循环融合。</text><text x="500" y="601" font-size="16" fill="#666" text-anchor="middle" font-family="&quot;Times New Roman&quot;,Times,serif">图中为逻辑读写，不等同于 DRAM 访问次数，也不表示采用融合乘加指令。</text></svg>