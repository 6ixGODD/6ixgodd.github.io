[package]
name = "bwww"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Filesystem-first static site builder for bochen.sh"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
latex2mathml = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["html", "regex-fancy"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tiny_http = "0.12"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
