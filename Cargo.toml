[package]
name = "bwww"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Filesystem-first static site builder for bochen.sh"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
